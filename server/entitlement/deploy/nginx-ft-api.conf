# Deployed 2026-10-30 on this server. andarfighttech.com reaches nginx through a Cloudflare tunnel
# (server block listens on 127.0.0.1:8084), so every request comes from 127.0.0.1 and the client address
# is the CF-Connecting-IP header, which Cloudflare sets (and overwrites when a client sends its own).

# /etc/nginx/conf.d/ft-api-ratelimit.conf  (http context)
limit_req_zone $http_cf_connecting_ip zone=ft_api_per_ip:10m rate=10r/m;

# /etc/nginx/sites-available/andar-corporate, inside the existing server {} block.
# The trailing slash on proxy_pass strips the public /ft-api prefix. No request bodies are logged.
location /ft-api/ {
    limit_req zone=ft_api_per_ip burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
    proxy_pass http://127.0.0.1:8805/;
}
