# Put these directives in nginx's existing `http {}` context.  The access-log
# format deliberately has no $request_body or $request_body_file field.
limit_req_zone $binary_remote_addr zone=ft_api_per_ip:10m rate=10r/m;
log_format ft_api_no_body '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';

# Put this location in the existing HTTPS `server {}` for andarfighttech.com.
# The trailing slash on proxy_pass strips the public /ft-api/ prefix.
location /ft-api/ {
    limit_req zone=ft_api_per_ip burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;

    access_log /var/log/nginx/ft-api.access.log ft_api_no_body;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8805/;
}
