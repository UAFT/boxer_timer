name: Android Play MVP AAB
# Google Play MVP only (release/play-mvp-* branches). Builds a signed AAB with targetSdk 36,
# derives a universal APK from that AAB with bundletool and smoke-tests it on an Android 16 emulator
# (release APK: launch; debug build of the same project: UI, lock screen, Home, Back through WebView DevTools).
# Nothing is uploaded to Google Play: the AAB is a workflow artifact for the owner.
on:
  workflow_dispatch:
  push:
    branches:
      - 'release/play-mvp-**'
permissions:
  contents: read
jobs:
  play-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-default-type=module --test tests/*.test.mjs
      - run: npm run build
      - name: Create Capacitor Android project
        run: |
          rm -rf android
          rm -f capacitor.config.ts
          # Android 15+ draws the app under the status and navigation bars (edge-to-edge); "auto" keeps the WebView inside them.
          echo '{"appId":"com.andarfighttech.boxertimer","appName":"Fight Tech Interval Timer","webDir":"dist","android":{"adjustMarginsForEdgeToEdge":"auto"}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Apply Fight Tech launcher icon
        run: |
          python3 - <<'PYICON'
          from pathlib import Path
          import shutil
          for density,size in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              folder=Path('android/app/src/main/res/mipmap-'+density)
              folder.mkdir(parents=True,exist_ok=True)
              for name in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  shutil.copyfile('app/assets/android-icon/icon-'+str(size)+'.png',folder/name)
          for file in Path('android/app/src/main/res').glob('mipmap-anydpi-v26/ic_launcher*.xml'):
              file.unlink()
          PYICON
      - name: Target API 36, Play version numbers
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os,re,pathlib,time
          p=pathlib.Path('android/variables.gradle')
          s=p.read_text()
          for key in ('compileSdkVersion','targetSdkVersion'):
              s,n=re.subn(key+r'\s*=\s*\d+', key+' = 36', s, count=1)
              assert n==1, key
          p.write_text(s)
          # AGP 8.7 (Capacitor 7) builds against API 36 with this flag.
          with open('android/gradle.properties','a') as f: f.write('\nandroid.suppressUnsupportedCompileSdk=36\n')
          p=pathlib.Path('android/app/build.gradle')
          s=p.read_text()
          assert 'com.andarfighttech.boxertimer' in s, 'Unexpected applicationId: refuse to sign'
          # One package ID for the Play MVP and the methodology build: whichever is built later installs over the other.
          # 20000 + minutes since 2026-10-30 UTC, the same clock in both workflows, above 1.0.6 (10006) and every 0.2.x APK.
          s,n=re.subn(r'versionCode\s+\d+', 'versionCode '+str(20000+(int(time.time())-1793318400)//60), s, count=1)
          assert n==1, 'Could not set versionCode'
          s,n=re.subn(r'versionName\s+"[^"]+"', 'versionName "1.0.'+os.environ['BUILD_NUMBER']+'"', s, count=1)
          assert n==1, 'Could not set versionName'
          p.write_text(s)
          PY
      - name: Build release AAB
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon bundleRelease assembleDebug
      - name: Sign AAB, derive universal APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDAR_TIMER_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDAR_TIMER_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDAR_TIMER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_PASS"
          KS="$RUNNER_TEMP/andar-timer.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/fight-tech-play-mvp.aab
          jarsigner -keystore "$KS" -storepass:env STORE_PASS -keypass:env KEY_PASS -sigalg SHA256withRSA -digestalg SHA-256 out/fight-tech-play-mvp.aab andar-fight-timer
          jarsigner -verify -certs out/fight-tech-play-mvp.aab | tail -3
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle=out/fight-tech-play-mvp.aab --output="$RUNNER_TEMP/u.apks" --mode=universal \
            --ks="$KS" --ks-key-alias=andar-fight-timer --ks-pass=pass:"$STORE_PASS" --key-pass=pass:"$KEY_PASS"
          rm -f "$KS"
          unzip -p "$RUNNER_TEMP/u.apks" universal.apk > out/fight-tech-play-mvp-universal.apk
          SDK_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_TOOLS/aapt2" dump badging out/fight-tech-play-mvp-universal.apk | grep -E "^package|targetSdkVersion|sdkVersion|uses-permission" | tee out/badging.txt
          grep -q "targetSdkVersion:'36'" out/badging.txt
          "$SDK_TOOLS/apksigner" verify --print-certs out/fight-tech-play-mvp-universal.apk | grep -i "SHA-256" | tee -a out/badging.txt
          (cd out && sha256sum fight-tech-play-mvp.aab fight-tech-play-mvp-universal.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: fight-tech-play-mvp-aab
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on Android 16 (API 36) emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: node scripts/android_play_smoke.mjs out/fight-tech-play-mvp-universal.apk android/app/build/outputs/apk/debug/app-debug.apk smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fight-tech-play-mvp-smoke
          path: smoke/
          retention-days: 30
