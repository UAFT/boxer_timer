name: Android signed APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-signed-apk.yml'
permissions:
  contents: read
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-default-type=module --test tests/*.test.mjs || test ! -d tests
      - run: npm run build
      - name: Create Capacitor Android project
        run: |
          rm -rf android
          rm -f capacitor.config.ts
          # Android 15+ draws the app under the status and navigation bars (edge-to-edge); "auto" keeps the WebView inside them.
          echo '{"appId":"com.andarfighttech.boxertimer","appName":"Fight Tech Interval Timer","webDir":"dist","android":{"adjustMarginsForEdgeToEdge":"auto"}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Apply Fight Tech launcher icon
        run: |
          python3 - <<'PYICON'
          from pathlib import Path
          import shutil
          for density,size in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              folder=Path('android/app/src/main/res/mipmap-'+density)
              folder.mkdir(parents=True,exist_ok=True)
              for name in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  shutil.copyfile('app/assets/android-icon/icon-'+str(size)+'.png',folder/name)
          for file in Path('android/app/src/main/res').glob('mipmap-anydpi-v26/ic_launcher*.xml'):
              file.unlink()
          PYICON
      - name: Target API 36, stable package ID, increasing versionCode
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os,re,pathlib,time
          # Same Android platform as the Play MVP build: target and compile against API 36.
          p=pathlib.Path('android/variables.gradle')
          s=p.read_text()
          for key in ('compileSdkVersion','targetSdkVersion'):
              s,n=re.subn(key+r'\s*=\s*\d+', key+' = 36', s, count=1)
              assert n==1, key
          p.write_text(s)
          with open('android/gradle.properties','a') as f: f.write('\nandroid.suppressUnsupportedCompileSdk=36\n')
          p=pathlib.Path('android/app/build.gradle')
          s=p.read_text()
          assert 'com.andarfighttech.boxertimer' in s, 'Unexpected applicationId: refuse to sign'
          # One package ID for the methodology and Play MVP builds: whichever is built later installs over the other.
          # 20000 + minutes since 2026-10-30 UTC, the same clock in both workflows, above the Play MVP 1.0.6 (10006).
          s,n=re.subn(r'versionCode\s+\d+', 'versionCode '+str(20000+(int(time.time())-1793318400)//60), s, count=1)
          assert n==1, 'Could not set versionCode'
          s,n=re.subn(r'versionName\s+"[^"]+"', 'versionName "0.2.'+os.environ['BUILD_NUMBER']+'"', s, count=1)
          assert n==1, 'Could not set versionName'
          p.write_text(s)
          PY
      - name: Build unsigned release APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease assembleDebug
      - name: Sign release APK with permanent keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDAR_TIMER_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDAR_TIMER_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDAR_TIMER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_PASS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/andar-timer.jks"
          chmod 600 "$RUNNER_TEMP/andar-timer.jks"
          SDK_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$SDK_TOOLS/zipalign" && test -x "$SDK_TOOLS/apksigner"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$UNSIGNED"
          "$SDK_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/andar-aligned.apk"
          "$SDK_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/andar-timer.jks" --ks-key-alias andar-fight-timer --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out andar-fight-timer-signed.apk "$RUNNER_TEMP/andar-aligned.apk"
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs andar-fight-timer-signed.apk
          rm -f "$RUNNER_TEMP/andar-timer.jks"
          "$SDK_TOOLS/aapt2" dump badging andar-fight-timer-signed.apk | grep -E "^package|targetSdkVersion|sdkVersion|uses-permission" | tee badging.txt
          grep -q "targetSdkVersion:'36'" badging.txt
          # Release audit 0.2.213 (closeout 2026-11-02): storage permissions only up to Android 10 (R6), Auto Backup with the
          # app's own rules (R7), WebView usage statistics not sent to Google.
          for p in READ WRITE; do grep -q "uses-permission: name='android.permission.${p}_EXTERNAL_STORAGE' maxSdkVersion='29'" badging.txt; done
          "$SDK_TOOLS/aapt2" dump xmltree --file AndroidManifest.xml andar-fight-timer-signed.apk > manifest.txt
          for a in 'allowBackup\(0x[0-9a-f]+\)=true' 'requestLegacyExternalStorage\(0x[0-9a-f]+\)=true' 'fullBackupContent\(0x[0-9a-f]+\)=@' 'dataExtractionRules\(0x[0-9a-f]+\)=@'; do grep -Eq "$a" manifest.txt || { echo "manifest: no $a"; exit 1; }; done
          grep -A2 '"android.webkit.WebView.MetricsOptOut"' manifest.txt | grep -Eq 'value\(0x[0-9a-f]+\)=true'
          sha256sum andar-fight-timer-signed.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: andar-fight-timer-signed-apk
          path: |
            andar-fight-timer-signed.apk
            badging.txt
            manifest.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      # The storage check below installs the debug build of the same project on Android 10, 11, 13 and 16.
      - uses: actions/upload-artifact@v4
        with:
          name: andar-fight-timer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Every build is installed over the published test APKs of both lines (one package ID, one key): methodology 0.2.192,
      # Play 0.2.208 and 0.2.213. The app's data must survive each update.
      - name: Previously published APKs for the upgrade check
        run: |
          base=https://andarfighttech.com/downloads/fight-tech-20261031
          curl -fsSL -o previous-0.2.192.apk $base/fight-tech-methodology-0.2.192.apk
          curl -fsSL -o previous-0.2.208.apk $base/fight-tech-play-ui-audio-0.2.208.apk
          curl -fsSL -o previous-0.2.213.apk $base/fight-tech-play-chief-ux-0.2.213.apk
          sha256sum -c <<'SUMS'
          38c21374e0c21c1ca0fdf17f3bbf7161311fbecb72777db88ffe6e3801df023b  previous-0.2.192.apk
          4e097c6a69e8738a698ff153ee382372f3d4ff485390c9985ecef83784fbe0e6  previous-0.2.208.apk
          7adb4d7349a8bbed760ce0946fbe4e080b9c52a3c338d96e3091ebc5c52505a2  previous-0.2.213.apk
          SUMS
      - name: Smoke test on Android 16 (API 36) emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FT_UPGRADE_FROM: previous-0.2.192.apk previous-0.2.208.apk previous-0.2.213.apk
          # Shared by both branches: the Play MVP hides Tree and Methodology, the methodology build shows them.
          FT_VARIANT: ${{ startsWith(github.ref_name, 'release/play-mvp') && 'play' || 'methodology' }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: node scripts/android_play_smoke.mjs andar-fight-timer-signed.apk android/app/build/outputs/apk/debug/app-debug.apk smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andar-fight-timer-smoke
          path: smoke/
          retention-days: 30
  # Release audit 0.2.213 R6/R7: «Сохранить в файл» on Android 10 (storage permission dialog) and later, and Auto Backup
  # (backup → uninstall → install → restore) with the app's own rules. scripts/android_storage_check.mjs.
  storage:
    needs: signed-apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 30, 33, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: andar-fight-timer-debug-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Storage check on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: node scripts/android_storage_check.mjs app-debug.apk storage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andar-fight-timer-storage-api${{ matrix.api-level }}
          path: storage/
          retention-days: 30
